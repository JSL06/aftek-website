<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aftek - Redirecting...</title>
  <script type="text/javascript">
    // Enhanced GitHub Pages SPA redirect for all routes
    (function() {
      var l = window.location;
      
      // Get the current path
      var currentPath = l.pathname;
      
      // Remove leading slash and clean up the path
      if (currentPath.startsWith('/')) {
        currentPath = currentPath.substring(1);
      }
      
      // Handle different route patterns
      if (currentPath && currentPath !== '') {
        // Clean up the path (remove multiple slashes, etc.)
        var cleanPath = currentPath.replace(/\/+/g, '/').replace(/^\/+|\/+$/g, '');
        
        if (cleanPath) {
          // Check if it's a project detail route
          if (cleanPath.startsWith('projects/') && cleanPath.includes('-')) {
            // This is likely a project detail route with UUID
            var projectId = cleanPath.split('/')[1];
            if (projectId && projectId.length > 20) { // UUID-like
              window.location.replace('/aftek-website/#/projects/' + projectId);
              return;
            }
          }
          
          // Check if it's a product detail route
          if (cleanPath.startsWith('products/') && cleanPath.includes('-')) {
            var productId = cleanPath.split('/')[1];
            if (productId && productId.length > 20) { // UUID-like
              window.location.replace('/aftek-website/#/products/' + productId);
              return;
            }
          }
          
          // Check if it's an article detail route
          if (cleanPath.startsWith('articles/')) {
            var articleSlug = cleanPath.split('/')[1];
            if (articleSlug) {
              window.location.replace('/aftek-website/#/articles/' + articleSlug);
              return;
            }
          }
          
          // For other routes, redirect to the correct base with hash
          window.location.replace('/aftek-website/#' + cleanPath);
          return;
        }
      }
      
      // If no path or empty, just go to the base
      window.location.replace('/aftek-website/');
    })();
  </script>
</head>
<body>
  <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
    <h2>Redirecting...</h2>
    <p>If you are not redirected automatically, <a href="/aftek-website/">click here</a>.</p>
  </div>
</body>
</html>
