<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aftek - Redirecting...</title>
  <script type="text/javascript">
    // GitHub Pages SPA redirect
    // This handles direct URL access to React Router routes
    (function() {
      var l = window.location;
      
      // Check if we're on GitHub Pages with /aftek-website/ base
      if (l.pathname.startsWith('/aftek-website/')) {
        // Extract the path after /aftek-website/
        var pathAfterBase = l.pathname.substring('/aftek-website/'.length);
        
        // If there's a path, redirect to the base with a hash
        if (pathAfterBase && pathAfterBase !== '') {
          // Clean up the path and redirect with hash
          var cleanPath = pathAfterBase.replace(/\/+/g, '/').replace(/^\/+|\/+$/g, '');
          if (cleanPath) {
            window.location.replace('/aftek-website/#' + cleanPath);
            return;
          }
        }
        
        // If no path or empty, just go to base
        window.location.replace('/aftek-website/');
      } else {
        // Not on GitHub Pages, redirect to root
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
    <h2>Redirecting...</h2>
    <p>If you are not redirected automatically, <a href="/aftek-website/">click here</a>.</p>
  </div>
</body>
</html>
