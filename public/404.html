<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aftek - Redirecting...</title>
  <script type="text/javascript">
    // GitHub Pages SPA redirect with base path support
    (function() {
      var l = window.location;
      
      // Check if we're on GitHub Pages with /aftek-website/ base
      if (l.hostname === 'jsl06.github.io') {
        var currentPath = l.pathname;
        
        // If the path doesn't start with /aftek-website/, redirect to it
        if (!currentPath.startsWith('/aftek-website/')) {
          // Extract the path and redirect to the correct base
          var cleanPath = currentPath.replace(/\/+/g, '/').replace(/^\/+|\/+$/g, '');
          if (cleanPath && cleanPath !== '') {
            window.location.replace('/aftek-website/#' + cleanPath);
          } else {
            window.location.replace('/aftek-website/');
          }
          return;
        }
        
        // If we're already at /aftek-website/ but with a path, convert to hash
        if (currentPath.startsWith('/aftek-website/')) {
          var pathAfterBase = currentPath.substring('/aftek-website/'.length);
          if (pathAfterBase && pathAfterBase !== '') {
            var cleanPath = pathAfterBase.replace(/\/+/g, '/').replace(/^\/+|\/+$/g, '');
            if (cleanPath) {
              window.location.replace('/aftek-website/#' + cleanPath);
              return;
            }
          }
        }
        
        // Default: go to base
        window.location.replace('/aftek-website/');
      } else {
        // Local development, redirect to root
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
    <h2>Redirecting...</h2>
    <p>If you are not redirected automatically, <a href="/aftek-website/">click here</a>.</p>
  </div>
</body>
</html>
