<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Product Save</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Debug Product Save - AFTEK Website</h1>
    
    <div class="form-group">
        <label for="name">Product Name:</label>
        <input type="text" id="name" value="Test Product - Debug" />
    </div>
    
    <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" rows="3">This is a test product for debugging the save issue</textarea>
    </div>
    
    <div class="form-group">
        <label for="category">Category:</label>
        <select id="category">
            <option value="Waterproofing">Waterproofing</option>
            <option value="Sealants & Adhesives">Sealants & Adhesives</option>
            <option value="Flooring Systems">Flooring Systems</option>
            <option value="Test Category">Test Category</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="price">Price:</label>
        <input type="number" id="price" value="99.99" step="0.01" />
    </div>
    
    <div class="form-group">
        <label for="isActive">Active:</label>
        <input type="checkbox" id="isActive" checked />
    </div>
    
    <div class="form-group">
        <label for="showInFeatured">Show in Featured:</label>
        <input type="checkbox" id="showInFeatured" />
    </div>
    
    <button onclick="saveProduct()">Save Product</button>
    <button onclick="testRead()">Test Read</button>
    <button onclick="checkTableStructure()">Check Table Structure</button>
    
    <div id="result"></div>

    <script>
        const supabaseUrl = 'https://txjhhwootljiqavnnghm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4amhod29vdGxqaXFhdm5uZ2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1ODc5MDQsImV4cCI6MjA2NzE2MzkwNH0.fJHzXibofO5jhnWp1COLbcHkamLf1l6hzwGdLpbt7YM';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function showResult(message, type = 'info') {
            const result = document.getElementById('result');
            result.innerHTML = `<div class="result ${type}">${message}</div>`;
        }

        async function saveProduct() {
            try {
                showResult('Saving product...', 'info');
                
                const productData = {
                    name: document.getElementById('name').value,
                    description: document.getElementById('description').value,
                    category: document.getElementById('category').value,
                    price: parseFloat(document.getElementById('price').value),
                    isActive: document.getElementById('isActive').checked,
                    showInFeatured: document.getElementById('showInFeatured').checked,
                    names: { en: document.getElementById('name').value },
                    tags: ['debug', 'test'],
                    features: ['Debug Feature 1', 'Debug Feature 2']
                };
                
                console.log('Attempting to save product with data:', productData);
                
                const { data, error } = await supabase
                    .from('products')
                    .insert([productData])
                    .select();
                
                if (error) {
                    console.error('Save error:', error);
                    showResult(`❌ Save failed: ${error.message}<br><br>Error details: ${JSON.stringify(error, null, 2)}`, 'error');
                    return;
                }
                
                console.log('Save successful:', data);
                showResult(`✅ Product saved successfully!<br><br>Product ID: ${data[0].id}<br>Name: ${data[0].name}<br>Created: ${data[0].created_at}`, 'success');
                
            } catch (err) {
                console.error('Exception during save:', err);
                showResult(`❌ Exception during save: ${err.message}`, 'error');
            }
        }

        async function testRead() {
            try {
                showResult('Testing read operation...', 'info');
                
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .limit(5);
                
                if (error) {
                    showResult(`❌ Read failed: ${error.message}`, 'error');
                    return;
                }
                
                showResult(`✅ Read successful! Found ${data.length} products:<br><br>${JSON.stringify(data, null, 2)}`, 'success');
                
            } catch (err) {
                showResult(`❌ Read exception: ${err.message}`, 'error');
            }
        }

        async function checkTableStructure() {
            try {
                showResult('Checking table structure...', 'info');
                
                // This will show us what columns exist
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .limit(1);
                
                if (error) {
                    showResult(`❌ Structure check failed: ${error.message}`, 'error');
                    return;
                }
                
                if (data && data.length > 0) {
                    const columns = Object.keys(data[0]);
                    showResult(`✅ Table structure check:<br><br>Available columns: ${columns.join(', ')}<br><br>Sample data: ${JSON.stringify(data[0], null, 2)}`, 'success');
                } else {
                    showResult('ℹ️ Table is empty, no columns to check', 'info');
                }
                
            } catch (err) {
                showResult(`❌ Structure check exception: ${err.message}`, 'error');
            }
        }

        // Auto-run structure check on page load
        window.onload = function() {
            showResult('Page loaded. Click buttons to test operations.', 'info');
        };
    </script>
</body>
</html>
