<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Loading Test</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .category-item { padding: 8px; margin: 4px 0; background: #f8f9fa; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Category Loading Test</h1>
    
    <div>
        <button onclick="testCategoryLoading()">Test Category Loading</button>
        <button onclick="testCategoryCRUD()">Test Category CRUD</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>
    <div id="categories"></div>
    
    <script>
        // Your Supabase credentials
        const supabaseUrl = 'https://txjhhwootljiqavnnghm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4amhod29vdGxqaXFhdm5uZ2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1ODc5MDQsImV4cCI6MjA2NzE2MzkwNH0.fJHzXibofO5jhnWp1COLbcHkamLf1l6hzwGdLpbt7YM';
        
        // Create Supabase client
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        function addResult(message, isError = false) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${isError ? 'error' : 'success'}`;
            resultDiv.innerHTML = `<strong>${isError ? '❌ ERROR' : '✅ SUCCESS'}:</strong> ${message}`;
            resultsDiv.appendChild(resultDiv);
        }
        
        function displayCategories(categories) {
            const categoriesDiv = document.getElementById('categories');
            categoriesDiv.innerHTML = '<h3>Loaded Categories:</h3>';
            
            if (categories.length === 0) {
                categoriesDiv.innerHTML += '<p>No categories found</p>';
                return;
            }
            
            categories.forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category-item';
                catDiv.innerHTML = `
                    <strong>${cat.name}</strong> 
                    (Order: ${cat.display_order}, Active: ${cat.is_active ? 'Yes' : 'No'})
                    ${cat.description ? `<br><small>${cat.description}</small>` : ''}
                `;
                categoriesDiv.appendChild(catDiv);
            });
        }
        
        async function testCategoryLoading() {
            try {
                addResult('Testing category loading...');
                
                // Test the exact same query your React app uses
                const { data, error } = await supabase
                    .from('product_categories')
                    .select('*')
                    .order('display_order', { ascending: true });

                if (error) {
                    addResult(`Category loading failed: ${error.message}`, true);
                    console.error('Error details:', error);
                } else {
                    addResult(`Category loading successful! Found ${data.length} categories`);
                    displayCategories(data);
                    console.log('Categories data:', data);
                }
                
            } catch (err) {
                addResult(`Category loading test failed: ${err.message}`, true);
            }
        }
        
        async function testCategoryCRUD() {
            try {
                addResult('Testing category CRUD operations...');
                
                // Test creating a category
                const testCategory = {
                    name: 'Test Category ' + Date.now(),
                    description: 'This is a test category',
                    display_order: 999,
                    is_active: true
                };
                
                const { data: created, error: createError } = await supabase
                    .from('product_categories')
                    .insert([testCategory])
                    .select()
                    .single();
                
                if (createError) {
                    addResult(`Create failed: ${createError.message}`, true);
                    return;
                }
                
                addResult(`Created test category: ${created.name}`);
                
                // Test updating the category
                const { error: updateError } = await supabase
                    .from('product_categories')
                    .update({ description: 'Updated description' })
                    .eq('id', created.id);
                
                if (updateError) {
                    addResult(`Update failed: ${updateError.message}`, true);
                } else {
                    addResult('Updated test category successfully');
                }
                
                // Test deleting the category
                const { error: deleteError } = await supabase
                    .from('product_categories')
                    .delete()
                    .eq('id', created.id);
                
                if (deleteError) {
                    addResult(`Delete failed: ${deleteError.message}`, true);
                } else {
                    addResult('Deleted test category successfully');
                }
                
            } catch (err) {
                addResult(`Category CRUD test failed: ${err.message}`, true);
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('categories').innerHTML = '';
        }
        
        // Auto-run category loading test on load
        window.onload = function() {
            addResult('Page loaded. Click buttons to test category operations.');
        };
    </script>
</body>
</html>
